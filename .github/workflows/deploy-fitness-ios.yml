name: Deploy Fitness iOS
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full 40-character main commit to release
        required: true
        type: string
      build_id:
        description: An EAS build of that commit to verify and submit instead of building again
        required: false
        type: string
        default: ""
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read
concurrency:
  group: fitness-ios-production
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'bentbrain/bent-mono' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 240
    environment:
      name: fitness-ios-production
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Require the input commit to be this run's main commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Pass the full 40-character main commit SHA." >&2
            exit 1
          fi
          if [[ "$INPUT_SHA" != "$RELEASE_SHA" ]]; then
            echo "The input commit is not the main commit this run started from." >&2
            exit 1
          fi
          if [[ -n "$INPUT_BUILD_ID" && ! "$INPUT_BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Pass build_id as an EAS build ID, or leave it empty." >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Qualify exact main source before installing
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-release-checks.mjs --sha "$RELEASE_SHA" > "$RUNNER_TEMP/quality-initial.json"
      - name: Check the release config and install the pinned EAS CLI
        timeout-minutes: 10
        run: |
          set -euo pipefail
          checks="$GITHUB_WORKSPACE/apps/fitness-ios/scripts/release-ios.mjs"
          node "$checks" check-config --out "$RUNNER_TEMP/release-config.json" --static-dir "$RUNNER_TEMP/eas-static"
          version="$(node -p 'require(process.argv[1]).easCliVersion' "$RUNNER_TEMP/release-config.json")"
          mkdir -p "$RUNNER_TEMP/eas-cli"
          cd "$RUNNER_TEMP/eas-cli"
          npm install --prefix "$RUNNER_TEMP/eas-cli" --no-audit --no-fund --ignore-scripts "eas-cli@$version"
          installed="$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/package.json")"
          test "$installed" = "$version"
          node "$checks" check-profile --eas-package "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/package.json"
      - name: Read the production EAS environment
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/eas-static
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_PROJECT_ROOT: ${{ runner.temp }}/eas-static
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" env:list --environment production --format short
          > "$RUNNER_TEMP/eas-env-pre.txt"
      - name: Hand the build's OAuth issuer and client to later steps
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs oauth-env --env-file "$RUNNER_TEMP/eas-env-pre.txt"
          >> "$GITHUB_ENV"
      - name: Admit the build's OAuth client
        timeout-minutes: 5
        run: node apps/fitness-ios/scripts/release-ios.mjs admit
      - name: List EAS builds of the commit
        if: inputs.build_id == ''
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/eas-static
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_PROJECT_ROOT: ${{ runner.temp }}/eas-static
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" build:list --platform ios
          --git-commit-hash "$RELEASE_SHA" --build-profile production --limit 50 --json --non-interactive
          > "$RUNNER_TEMP/eas-existing.json"
      - name: Require no earlier build of the commit
        if: inputs.build_id == ''
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs check-no-builds --sha "$RELEASE_SHA"
          --file "$RUNNER_TEMP/eas-existing.json"
      # The workspace is installed only for the build, after the EAS steps that hold the token run from the static directory.
      - uses: ./.github/actions/setup
        if: inputs.build_id == ''
      - name: Require a clean checkout of the exact commit
        if: inputs.build_id == ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Qualify again immediately before the build
        if: inputs.build_id == ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/require-release-checks.mjs --sha "$RELEASE_SHA" > "$RUNNER_TEMP/quality-build.json"
          node apps/fitness-ios/scripts/release-ios.mjs same-quality --initial "$RUNNER_TEMP/quality-initial.json" --current "$RUNNER_TEMP/quality-build.json"
      - name: Build on EAS
        if: inputs.build_id == ''
        timeout-minutes: 150
        working-directory: apps/fitness-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOTENV: "1"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" build --profile production --platform ios
          --non-interactive --json --wait > "$RUNNER_TEMP/eas-build.json"
      - name: Read the build to resume
        if: inputs.build_id != ''
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/eas-static
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_PROJECT_ROOT: ${{ runner.temp }}/eas-static
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
          BUILD_INPUT: ${{ inputs.build_id }}
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" build:view "$BUILD_INPUT" --json
          > "$RUNNER_TEMP/eas-build.json"
      - name: Verify the build and its signed archive
        id: verify
        timeout-minutes: 30
        env:
          BUILD_INPUT: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          checks="apps/fitness-ios/scripts/release-ios.mjs"
          downloads="$RUNNER_TEMP/ipa"
          node "$checks" check-build --sha "$RELEASE_SHA" --build-file "$RUNNER_TEMP/eas-build.json" \
            --build-id "$BUILD_INPUT" --downloads-dir "$downloads" --out "$RUNNER_TEMP/build.json"
          # Each signed URL is in a private curl config, never on the command line or in a log.
          # curl follows at most five HTTPS redirects, and only its exit code is shown.
          download() {
            local status=0
            curl --fail --silent --location --max-redirs 5 --proto '=https' --proto-redir '=https' --globoff \
              --max-time "$2" --config "$1" 2>/dev/null || status=$?
            return "$status"
          }
          status=0
          download "$downloads/archive.curlrc" 1200 || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "The build archive could not be downloaded (curl exit $status)." >&2
            exit 1
          fi
          for config in "$downloads"/log-*.curlrc; do
            [[ -e "$config" ]] || continue
            status=0
            download "$config" 120 || status=$?
            if [[ "$status" -ne 0 ]]; then
              echo "A build log could not be downloaded (curl exit $status)." >&2
            fi
          done
          node "$checks" verify-archive --archive "$downloads/app.ipa" --logs-dir "$downloads/logs" \
            --build "$RUNNER_TEMP/build.json" --work-dir "$downloads/work" --out "$RUNNER_TEMP/verified.json"
          echo "build_id=$(node -p 'require(process.argv[1]).buildId' "$RUNNER_TEMP/verified.json")" >> "$GITHUB_OUTPUT"
      - name: Read the production EAS environment again
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/eas-static
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_PROJECT_ROOT: ${{ runner.temp }}/eas-static
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" env:list --environment production --format short
          > "$RUNNER_TEMP/eas-env-post.txt"
      - name: Admit again before submitting
        timeout-minutes: 5
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs admit --current-env-file "$RUNNER_TEMP/eas-env-post.txt"
          --check-privacy
      - name: Prepare the submission lookup for the resumed build
        if: inputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.verify.outputs.build_id }}
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs submissions-query --build-id "$BUILD_ID"
          --out "$RUNNER_TEMP/submissions-query.json"
      - name: List the resumed build's submissions
        if: inputs.build_id != ''
        timeout-minutes: 5
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # The token goes to curl on stdin, never on the command line.
          status=0
          printf 'header = "Authorization: Bearer %s"\n' "$EXPO_TOKEN" | curl --fail --silent --proto '=https' \
            --max-time 60 --config - --header 'Content-Type: application/json' \
            --data "@$RUNNER_TEMP/submissions-query.json" https://api.expo.dev/graphql \
            > "$RUNNER_TEMP/eas-submissions.json" 2>/dev/null || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "EAS could not list the build's submissions (curl exit $status)." >&2
            exit 1
          fi
      - name: Require no earlier submission of the resumed build
        if: inputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.verify.outputs.build_id }}
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs check-no-submissions --build-id "$BUILD_ID"
          --file "$RUNNER_TEMP/eas-submissions.json"
      - name: Qualify again immediately before submitting
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/require-release-checks.mjs --sha "$RELEASE_SHA" > "$RUNNER_TEMP/quality-submit.json"
          node apps/fitness-ios/scripts/release-ios.mjs same-quality --initial "$RUNNER_TEMP/quality-initial.json" --current "$RUNNER_TEMP/quality-submit.json"
      - name: Submit the build to TestFlight
        timeout-minutes: 60
        working-directory: ${{ runner.temp }}/eas-static
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_PROJECT_ROOT: ${{ runner.temp }}/eas-static
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
          BUILD_ID: ${{ steps.verify.outputs.build_id }}
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" submit --profile production --platform ios
          --id "$BUILD_ID" --no-auto-testflight-setup --non-interactive --wait
      - name: Summarize the release
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs summary --file "$RUNNER_TEMP/verified.json"
          --sha "$RELEASE_SHA" --status submitted >> "$GITHUB_STEP_SUMMARY"
      - name: Remove build files
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/eas-build.json" "$RUNNER_TEMP/eas-existing.json"
          "$RUNNER_TEMP/eas-env-pre.txt" "$RUNNER_TEMP/eas-env-post.txt" "$RUNNER_TEMP/eas-submissions.json"
          "$RUNNER_TEMP/eas-cli" "$RUNNER_TEMP/eas-static"
