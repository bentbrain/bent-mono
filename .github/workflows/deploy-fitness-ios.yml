name: Deploy Fitness iOS
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full 40-character main commit to release
        required: true
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read
concurrency:
  group: fitness-ios-production
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'bentbrain/bent-mono' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 240
    environment:
      name: fitness-ios-production
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Require the input commit to be this run's main commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Pass the full 40-character main commit SHA." >&2
            exit 1
          fi
          if [[ "$INPUT_SHA" != "$RELEASE_SHA" ]]; then
            echo "The input commit is not the main commit this run started from." >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Qualify exact main source before installing
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-release-checks.mjs --sha "$RELEASE_SHA" > "$RUNNER_TEMP/quality-initial.json"
      - uses: ./.github/actions/setup
      - name: Require a clean checkout of the exact commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Check the release config and install the pinned EAS CLI
        timeout-minutes: 10
        run: |
          set -euo pipefail
          checks="$GITHUB_WORKSPACE/apps/fitness-ios/scripts/release-ios.mjs"
          node "$checks" check-config --out "$RUNNER_TEMP/release-config.json"
          version="$(node -p 'require(process.argv[1]).easCliVersion' "$RUNNER_TEMP/release-config.json")"
          mkdir -p "$RUNNER_TEMP/eas-cli"
          cd "$RUNNER_TEMP/eas-cli"
          npm install --prefix "$RUNNER_TEMP/eas-cli" --no-audit --no-fund --ignore-scripts "eas-cli@$version"
          installed="$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/package.json")"
          test "$installed" = "$version"
          node "$checks" check-profile --eas-package "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/package.json"
      - name: Read the production EAS environment
        timeout-minutes: 5
        working-directory: apps/fitness-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" env:list --environment production --format short
          > "$RUNNER_TEMP/eas-env-pre.txt"
      - name: Admit the build's OAuth client
        timeout-minutes: 5
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs admit --env-file "$RUNNER_TEMP/eas-env-pre.txt"
          --out "$RUNNER_TEMP/oauth.json"
      - name: Qualify again before the build
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/require-release-checks.mjs --sha "$RELEASE_SHA" > "$RUNNER_TEMP/quality-build.json"
          node apps/fitness-ios/scripts/release-ios.mjs same-quality --initial "$RUNNER_TEMP/quality-initial.json" --current "$RUNNER_TEMP/quality-build.json"
      - name: List EAS builds of the commit
        timeout-minutes: 5
        working-directory: apps/fitness-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" build:list --platform ios
          --git-commit-hash "$RELEASE_SHA" --build-profile production --limit 50 --json --non-interactive
          > "$RUNNER_TEMP/eas-existing.json"
      - name: Require no earlier build of the commit
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs check-no-builds --sha "$RELEASE_SHA"
          --file "$RUNNER_TEMP/eas-existing.json"
      - name: Build on EAS
        timeout-minutes: 150
        working-directory: apps/fitness-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" build --profile production --platform ios
          --non-interactive --json --wait > "$RUNNER_TEMP/eas-build.json"
      - name: Verify the build and its signed archive
        id: verify
        timeout-minutes: 30
        run: |
          set -euo pipefail
          node apps/fitness-ios/scripts/release-ios.mjs verify-build --sha "$RELEASE_SHA" \
            --build-file "$RUNNER_TEMP/eas-build.json" --oauth-file "$RUNNER_TEMP/oauth.json" \
            --work-dir "$RUNNER_TEMP/ipa" --out "$RUNNER_TEMP/verified.json"
          echo "build_id=$(node -p 'require(process.argv[1]).buildId' "$RUNNER_TEMP/verified.json")" >> "$GITHUB_OUTPUT"
      - name: Read the production EAS environment again
        timeout-minutes: 5
        working-directory: apps/fitness-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" env:list --environment production --format short
          > "$RUNNER_TEMP/eas-env-post.txt"
      - name: Qualify and admit again before submitting
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/require-release-checks.mjs --sha "$RELEASE_SHA" > "$RUNNER_TEMP/quality-submit.json"
          node apps/fitness-ios/scripts/release-ios.mjs same-quality --initial "$RUNNER_TEMP/quality-initial.json" --current "$RUNNER_TEMP/quality-submit.json"
          node apps/fitness-ios/scripts/release-ios.mjs admit --env-file "$RUNNER_TEMP/eas-env-post.txt" \
            --expected-oauth "$RUNNER_TEMP/oauth.json" --check-privacy
      - name: Submit the build to TestFlight
        timeout-minutes: 60
        working-directory: apps/fitness-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOTENV: "1"
          NO_COLOR: "1"
          BUILD_ID: ${{ steps.verify.outputs.build_id }}
        run: >-
          node "$RUNNER_TEMP/eas-cli/node_modules/eas-cli/bin/run" submit --profile production --platform ios
          --id "$BUILD_ID" --non-interactive --wait
      - name: Summarize the release
        run: >-
          node apps/fitness-ios/scripts/release-ios.mjs summary --file "$RUNNER_TEMP/verified.json"
          --sha "$RELEASE_SHA" --status submitted >> "$GITHUB_STEP_SUMMARY"
      - name: Remove build files
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/eas-build.json" "$RUNNER_TEMP/eas-existing.json"
          "$RUNNER_TEMP/eas-env-pre.txt" "$RUNNER_TEMP/eas-env-post.txt" "$RUNNER_TEMP/eas-cli"
