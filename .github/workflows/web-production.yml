name: Deploy web-only Production

run-name: Storefront Production · ${{ github.ref_name }} · ${{ github.sha }} · [${{ inputs.coordination_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Optional exact main commit for coordinated releases
        type: string
      coordination_id:
        description: Optional journal correlation ID
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: products/shop

jobs:
  validate:
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      statuses: read
      checks: read
      actions: read
      pull-requests: read
      contents: read
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Reuse CI for the exact release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import ./scripts/public-release-logging.mjs scripts/reuse-ci.mjs
      - name: Check commit without existing CI
        if: steps.ci.outputs.reused != 'true'
        uses: ./products/shop/.github/actions/check
        env:
          TURBO_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.ref == 'refs/heads/main' && vars.TURBO_TEAM || '' }}
      - name: Preserve encrypted operational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    permissions:
      pull-requests: read
      statuses: read
      checks: read
      actions: read
      contents: read
      deployments: write
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
      FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
      FOREVER_TEE_API_URL: ${{ vars.WORKER_URL }}
      FOREVER_TEE_ENFORCE_WORKER_RELEASE: "1"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Verify live Worker before installing deployment dependencies
        run: node apps/web/scripts/verify-worker-release.mjs
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Stage, verify and promote storefront
        env:
          WEB_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/web-production-evidence
        run: node --import ./scripts/public-release-logging.mjs scripts/web-production-release.mjs
      - name: Seal private release evidence
        if: always()
        env:
          WEB_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/web-production-evidence
        run: node --import ./scripts/public-release-logging.mjs scripts/seal-release-artifacts.mjs
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-production-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-web-production-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve encrypted operational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
