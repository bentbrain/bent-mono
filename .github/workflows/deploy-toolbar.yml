name: Deploy Toolbar
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
concurrency:
  group: toolbar-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.TOOLBAR_DEPLOYMENT_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: toolbar-production
      url: https://toolbar.bent.build
    permissions:
      contents: write
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Require the exact qualified main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-release-checks.mjs --sha "$RELEASE_SHA"
      - uses: ./.github/actions/setup
      - name: Release retained frontend and API Worker
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          FEEDBACK_API_ORIGIN: ${{ vars.FEEDBACK_API_ORIGIN }}
          FEEDBACK_PROXY_SECRET: ${{ secrets.FEEDBACK_PROXY_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          TOOLBAR_PRESERVE_RUNTIME_SECRETS: ${{ vars.TOOLBAR_PRESERVE_RUNTIME_SECRETS }}
          TOOLBAR_MIGRATED_ARCHIVE_JSON: ${{ secrets.TOOLBAR_MIGRATED_ARCHIVE_JSON }}
          TOOLBAR_LEGACY_ARCHIVE_REPOSITORY: ${{ secrets.TOOLBAR_LEGACY_ARCHIVE_REPOSITORY }}
          TOOLBAR_LEGACY_ARCHIVE_TOKEN: ${{ secrets.TOOLBAR_LEGACY_ARCHIVE_TOKEN }}
        run: node --import tsx apps/toolbar/scripts/deploy-production.ts
