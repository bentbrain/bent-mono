name: Build native Development candidate
run-name: Native development · ${{ inputs.operation }} · ${{ inputs.release_mode || 'full' }} · ${{ inputs.verify_release || '-' }} · ${{ inputs.rollback_release || '-' }} · ${{ github.ref_name }} · ${{ github.sha }} · [${{ inputs.coordination_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Optional exact main commit for coordinated releases
        type: string
      coordination_id:
        description: Optional journal correlation ID
        type: string
      operation:
        description: Plan/deploy a pair, independently qualify the live pair, or recover it
        type: choice
        default: plan
        options: [stage-forward-completion-authority, complete-forward-release, plan, build-candidate, release, rollback, recover-rollback, stage-forward-recovery-authority, plan-forward-recovery, recover-forward-release, qualify, qualify-exhaustion, qualify-faults, qualify-termination, qualify-load, qualify-all, verify-qualification, repair-schedule, cleanup-qualification, cleanup-failed-qualification, qualify-components]
      release_mode:
        description: API mode reuses the live image; relevant qualification is required separately before Production
        type: choice
        default: full
        options: [full, api]
      verify_release:
        description: For qualification or schedule repair, the live native-RUN_ID
        type: string
        required: false
      qualification_reference:
        description: For cleanup recovery, exact immutable functional-summary JSON; failed cleanup uses original cleanup-inventory JSON
        type: string
        required: false
      scheduled_qualification:
        description: Weekly full check; preserve the existing owner-reviewed renderer baseline
        type: boolean
        default: false
      renderer_reference:
        description: For component qualification, the immutable full renderer receipt reference JSON
        type: string
        required: false
      rollback_release:
        description: Original release for rollback; failed rollback run for recover-rollback
        type: string
        required: false

      completion_reference:
        description: Sealed independently approved failed recovery completion authority
        type: string
        required: false

      forward_recovery_reference:
        description: Sealed immutable authority and approved full-plan references for Development forward recovery
        type: string
        required: false

      rollback_reference:
        description: For recover-rollback only, exact immutable original rollback.json reference
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: products/shop

jobs:
  check:
    environment: Preview
    if: github.repository_id == vars.SHOP_REPOSITORY_ID && github.repository_owner_id == vars.SHOP_OWNER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      statuses: read
      checks: read
      contents: read
      actions: read
      pull-requests: read
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Check native request before dependency installation
        env:
          NATIVE_COMPLETION_PACKAGE: ${{ inputs.operation == 'stage-forward-completion-authority' && secrets.SHOP_DEVELOPMENT_COMPLETION_PACKAGE || '' }}
          NATIVE_COMPLETION_REFERENCE: ${{ inputs.completion_reference }}
          NATIVE_FORWARD_RECOVERY_PACKAGE: ${{ inputs.operation == 'stage-forward-recovery-authority' && secrets.SHOP_DEVELOPMENT_FORWARD_RECOVERY_PACKAGE || '' }}
          OPERATION: ${{ inputs.operation }}
          NATIVE_RELEASE_MODE: ${{ inputs.release_mode || 'full' }}
          NATIVE_VERIFY_RELEASE: ${{ inputs.verify_release }}
          NATIVE_QUALIFICATION_REFERENCE: ${{ inputs.qualification_reference }}
          NATIVE_RENDERER_REFERENCE: ${{ inputs.renderer_reference }}
          NATIVE_SCHEDULED_QUALIFICATION: ${{ inputs.scheduled_qualification }}
          NATIVE_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          NATIVE_ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
          NATIVE_FORWARD_RECOVERY_REFERENCE: ${{ inputs.forward_recovery_reference }}
        run: node --import ./scripts/decode-release-dispatch.mjs --import ./scripts/public-release-logging.mjs scripts/release-preflight.mjs --environment development --lane native --operation "$OPERATION"
      - name: Reuse CI for the exact release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import ./scripts/public-release-logging.mjs scripts/reuse-ci.mjs
      - name: Check commit without existing CI
        if: steps.ci.outputs.reused != 'true'
        uses: ./products/shop/.github/actions/check
        env:
          TURBO_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.ref == 'refs/heads/main' && vars.TURBO_TEAM || '' }}
      - name: Preserve encrypted operational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: Preview
    permissions:
      pull-requests: read
      statuses: read
      checks: read
      contents: read
      id-token: write
      actions: read
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
        if: inputs.operation == 'complete-forward-release' || inputs.operation == 'plan-forward-recovery' || inputs.operation == 'recover-forward-release' || inputs.operation == 'plan' || inputs.operation == 'release' || inputs.operation == 'rollback' || inputs.operation == 'recover-rollback' || inputs.operation == 'qualify-all' || inputs.operation == 'qualify-components' || inputs.operation == 'cleanup-failed-qualification'
      - run: bun install --frozen-lockfile
        working-directory: .
        if: inputs.operation == 'complete-forward-release' || inputs.operation == 'plan-forward-recovery' || inputs.operation == 'recover-forward-release' || inputs.operation == 'plan' || inputs.operation == 'release' || inputs.operation == 'rollback' || inputs.operation == 'recover-rollback' || inputs.operation == 'qualify-all' || inputs.operation == 'qualify-components' || inputs.operation == 'cleanup-failed-qualification'
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.SHOP_AWS_DEVELOPMENT_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ secrets.SHOP_AWS_ACCOUNT_ID }}
          role-session-name: native-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          retry-max-attempts: 3
      - name: Verify candidate and execute only the selected guarded Development operation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
          FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
          PRODUCT_IMAGE_RENDERER_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRINTIFY_ASSET_DELIVERY_SECRET: ${{ secrets.PRINTIFY_ASSET_DELIVERY_SECRET }}
          PRINTIFY_WEBHOOK_SECRET: ${{ secrets.PRINTIFY_WEBHOOK_SECRET }}
          CART_LINE_CAPABILITY_SECRET: ${{ secrets.CART_LINE_CAPABILITY_SECRET }}
          NATIVE_COMPLETION_PACKAGE: ${{ inputs.operation == 'stage-forward-completion-authority' && secrets.SHOP_DEVELOPMENT_COMPLETION_PACKAGE || '' }}
          NATIVE_COMPLETION_REFERENCE: ${{ inputs.completion_reference }}
          NATIVE_FORWARD_RECOVERY_PACKAGE: ${{ inputs.operation == 'stage-forward-recovery-authority' && secrets.SHOP_DEVELOPMENT_FORWARD_RECOVERY_PACKAGE || '' }}
          NATIVE_CANDIDATE_RECEIPT: ${{ secrets.SHOP_DEVELOPMENT_CANDIDATE_RECEIPT }}
          NATIVE_OPERATION: ${{ inputs.operation || 'plan' }}
          NATIVE_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          NATIVE_ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
          NATIVE_FORWARD_RECOVERY_REFERENCE: ${{ inputs.forward_recovery_reference }}
          NATIVE_RELEASE_MODE: ${{ inputs.release_mode || 'full' }}
          NATIVE_VERIFY_RELEASE: ${{ inputs.verify_release }}
          NATIVE_QUALIFICATION_REFERENCE: ${{ inputs.qualification_reference }}
          NATIVE_RENDERER_REFERENCE: ${{ inputs.renderer_reference }}
          NATIVE_SCHEDULED_QUALIFICATION: ${{ inputs.scheduled_qualification }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import ./scripts/decode-release-dispatch.mjs --import ./scripts/public-release-logging.mjs scripts/native-ci-development.mjs
      - name: Preserve sealed candidate pointer
        if: always() && (inputs.operation == 'build-candidate' || inputs.operation == 'release')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-reference.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve immutable qualification reference pointers
        if: always() && (inputs.operation == 'qualify-all' || inputs.operation == 'cleanup-qualification' || inputs.operation == 'qualify-components')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-reference-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qualification*reference.json
            ${{ runner.temp }}/renderer-reference.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve release stage timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-timings-${{ github.run_id }}
          path: ${{ runner.temp }}/release-timings.ndjson
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve encrypted operational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
