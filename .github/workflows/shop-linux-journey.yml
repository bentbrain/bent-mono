name: Shop Linux customer journey

on:
  pull_request:
    paths:
      - 'products/shop/**'
      - 'packages/design-tokens/**'
      - 'packages/ui/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/shop-linux-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: Built Linux J01
    if: github.repository == 'bentbrain/bent-mono' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --ipc=host --init
      volumes:
        - /usr/bin/unzip:/usr/bin/unzip:ro
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Prepare private execution evidence
        run: |
          umask 077
          PRIVATE_EVIDENCE="$RUNNER_TEMP/shop-linux-private"
          printf 'PRIVATE_EVIDENCE=%s\n' "$PRIVATE_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -m 700 "$PRIVATE_EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
      - name: Install the pinned encoder
        run: |
          node products/shop/scripts/testing/linux-hosted-validation.mjs encoder
      - name: Install frozen dependencies
        run: |
          umask 077
          if ! bun install --frozen-lockfile >"$PRIVATE_EVIDENCE/install.private.log" 2>&1; then
            echo 'Frozen dependency installation failed. Inspect the encrypted Linux evidence.'
            exit 1
          fi
      - name: Build the Start candidate
        env:
          CI: 'true'
        run: |
          umask 077
          if ! bun run --filter @forever-tee/storefront build >"$PRIVATE_EVIDENCE/build.private.log" 2>&1; then
            echo 'Start build failed. Inspect the encrypted Linux evidence.'
            exit 1
          fi
      - name: Package and execute the actual Linux journey
        run: node products/shop/scripts/testing/linux-hosted-validation.mjs journey
      - name: Seal private Linux evidence
        if: always()
        run: node products/shop/scripts/testing/linux-hosted-validation.mjs seal
      - name: Preserve encrypted Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shop-linux-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shop-linux-sealed
          if-no-files-found: error
          retention-days: 14
