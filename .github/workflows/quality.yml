name: Quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-qualification:
    name: Release qualification
    if: always()
    needs: [checks, browser, public-source, secrets, dependencies, codeql, fitness-ios, fitness-ios-native, codeql-swift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Quality job
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.QUALITY_RESULTS);
            const expected = ["checks", "browser", "public-source", "secrets", "dependencies", "codeql",
              "fitness-ios", "fitness-ios-native", "codeql-swift"];
            if (Object.keys(jobs).sort().join() !== expected.sort().join() ||
                Object.values(jobs).some(job => job.result !== "success")) {
              throw new Error("Every Quality job must succeed before production release");
            }
          '
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, knip, build, "test:integration"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: payload_migration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PAYLOAD_MIGRATION_TEST_DATABASE_URI: postgresql://test:test@127.0.0.1:5432/payload_migration_test
      PAYLOAD_STORAGE_SOURCE: r2
      R2_BUCKET: fixture-bucket
      R2_ENDPOINT: https://storage.example.invalid
      R2_PUBLIC_URL: https://media.example.invalid
      R2_ACCESS_KEY_ID: fixture-access
      R2_SECRET_ACCESS_KEY: fixture-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/ci-check.mjs '${{ matrix.check }}'
  browser-scope:
    name: Select browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_work: ${{ steps.scope.outputs.has_work }}
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: scope
        run: node scripts/ci-scope.mjs
  browser-suite:
    name: ${{ matrix.name }}
    needs: browser-scope
    if: needs.browser-scope.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-scope.outputs.matrix) }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0
      options: --ipc=host --init
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
        - /usr/bin/zip:/usr/bin/zip:ro
        - /usr/bin/unzip:/usr/bin/unzip:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: .
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run browser suite
        env:
          BROWSER_APP: ${{ matrix.app }}
          SHARD_PART: ${{ matrix.part }}
          SHARD_TOTAL: ${{ matrix.total }}
          E2E_TIER: ${{ needs.browser-scope.outputs.tier }}
        run: |
          node scripts/install-browsers.mjs browser "$BROWSER_APP"
          node scripts/ci-check.mjs browser "$BROWSER_APP" "$SHARD_PART" "$SHARD_TOTAL"
      - name: Upload synthetic Trackmap browser results
        if: always() && matrix.app == 'trackmap'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trackmap-browser-results
          path: apps/trackmap/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload synthetic browser coverage and timing
        if: always() && matrix.app == 'jp'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blog-browser-coverage-and-timing-${{ matrix.part }}-of-${{ matrix.total }}
          path: apps/jp/artifacts/browser/
          if-no-files-found: error
          retention-days: 14
  browser:
    # Branch protection and release qualification require this stable context.
    name: browser
    if: always()
    needs: [browser-scope, browser-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require all selected browser suites
        env:
          SCOPE_RESULT: ${{ needs.browser-scope.result }}
          HAS_WORK: ${{ needs.browser-scope.outputs.has_work }}
          BROWSER_MATRIX: ${{ needs.browser-scope.outputs.matrix }}
          SUITE_RESULT: ${{ needs.browser-suite.result }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-browser-suites.mjs
  public-source:
    name: public-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - run: node scripts/check-public-source.mjs
      - run: node --test scripts/*.test.mjs
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gitleaks v8.30.1, Linux x64 release asset.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-max-time 60 --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer ${GH_TOKEN:?GitHub token is required}" \
            --header 'Accept: application/octet-stream' --output /tmp/gitleaks.tar.gz \
            https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks git --redact --log-opts=--all
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun audit --audit-level=high
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The raw-flow gate requires both complete suites on PRs and main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_OVERLAY_ANALYSIS: 'false'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Download verified CodeQL bundle
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CodeQL v2.27.4, JavaScript Linux x64 release asset.
          archive="$RUNNER_TEMP/codeql-bundle-javascript-linux64.tar.zst"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-max-time 180 --connect-timeout 10 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN:?GitHub token is required}" \
            --header 'Accept: application/octet-stream' --output "$archive" \
            https://api.github.com/repos/github/codeql-action/releases/assets/692239234
          printf '%s  %s\n' '082e798c97831283a2a5f69e9198c51270e5767013d5333daeeab6520af9ce72' "$archive" | sha256sum --check
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          tools: ${{ runner.temp }}/codeql-bundle-javascript-linux64.tar.zst
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Require clean analysis
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: node scripts/check-sarif.mjs
      - name: Retain original CodeQL report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-original-sarif
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
  fitness-ios:
    name: fitness-ios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/fitness-ios
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip
      - run: bun run test
      - name: Read the Expo config for each variant
        run: |
          APP_VARIANT=development bunx expo config --type public --json > /dev/null
          APP_VARIANT=production bunx expo config --type public --json > /dev/null
      - run: bunx expo-doctor
      - run: node scripts/fingerprint-check.mjs
  fitness-ios-native:
    name: fitness-ios-native
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/fitness-ios
    env:
      NATIVE_BUILD_DIR: ${{ runner.temp }}/fitness-ios
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          node scripts/native.mjs xcode 26.6
      - uses: ./.github/actions/setup
      - name: Install verified SwiftLint
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SwiftLint 0.65.1, portable macOS release asset.
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-max-time 60 --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer ${GH_TOKEN:?GitHub token is required}" \
            --header 'Accept: application/octet-stream' --output "$archive" \
            https://api.github.com/repos/realm/SwiftLint/releases/assets/524187565
          printf '%s  %s\n' 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0' "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/swiftlint" && unzip -q "$archive" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - run: node scripts/native.mjs lint
      - run: node scripts/native.mjs prebuild
      - run: node scripts/native.mjs build
      - run: node scripts/native.mjs artifact
      - run: node scripts/native.mjs seeder
      - run: node scripts/native.mjs core-test
  codeql-swift:
    name: CodeQL Swift
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # The raw-flow gate requires both complete suites on PRs and main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_OVERLAY_ANALYSIS: 'false'
      NATIVE_BUILD_DIR: ${{ runner.temp }}/fitness-ios
      APP_VARIANT: production
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rosetta for the CodeQL Swift tracer
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Select Xcode 26.6
        working-directory: apps/fitness-ios
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          node scripts/native.mjs xcode 26.6
      - uses: ./.github/actions/setup
      - name: Generate the production native project
        working-directory: apps/fitness-ios
        run: node scripts/native.mjs prebuild
      - name: Download verified CodeQL bundle
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CodeQL v2.27.4, Swift macOS release asset.
          archive="$RUNNER_TEMP/codeql-bundle-swift-osx64.tar.zst"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-max-time 300 --connect-timeout 10 --max-time 300 \
            --header "Authorization: Bearer ${GH_TOKEN:?GitHub token is required}" \
            --header 'Accept: application/octet-stream' --output "$archive" \
            https://api.github.com/repos/github/codeql-action/releases/assets/692239631
          printf '%s  %s\n' '52e3f0ea756787f0ceb2e5b2553d2560ba1d83573e3f77002f31833b307fbebc' "$archive" | shasum -a 256 --check
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          tools: ${{ runner.temp }}/codeql-bundle-swift-osx64.tar.zst
          languages: swift
          build-mode: manual
          queries: security-extended,security-and-quality
      - name: Build the app, the seeder and the XCTest targets
        working-directory: apps/fitness-ios
        env:
          XCODEBUILD_SETTINGS: CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
        run: |
          node scripts/native.mjs build
          node scripts/native.mjs seeder
          node scripts/native.mjs core-build
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          category: fitness-codeql-swift
          output: ${{ runner.temp }}/codeql-swift-results
      - name: Require clean analysis
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-swift-results
          CODEQL_LANGUAGES: swift
        run: node scripts/check-sarif.mjs
      - name: Require complete extraction
        working-directory: apps/fitness-ios
        run: node scripts/codeql-coverage.mjs "$RUNNER_TEMP/codeql_databases/swift" "$NATIVE_BUILD_DIR/app"
      - name: Retain original CodeQL report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-swift-original-sarif
          path: ${{ runner.temp }}/codeql-swift-results/*.sarif
          if-no-files-found: error
          retention-days: 14
