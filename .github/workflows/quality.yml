name: Quality
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, knip, build, 'test:integration']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: payload_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PAYLOAD_MIGRATION_TEST_DATABASE_URI: postgresql://test:test@127.0.0.1:5432/payload_migration_test
      PAYLOAD_STORAGE_SOURCE: r2
      R2_BUCKET: fixture-bucket
      R2_ENDPOINT: https://storage.example.invalid
      R2_PUBLIC_URL: https://media.example.invalid
      R2_ACCESS_KEY_ID: fixture-access
      R2_SECRET_ACCESS_KEY: fixture-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/ci-check.mjs '${{ matrix.check }}'
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/install-browsers.mjs browser
      - run: node scripts/ci-check.mjs browser
        env:
          E2E_TIER: ${{ github.event_name == 'schedule' && 'full' || 'critical' }}
      - name: Upload synthetic browser coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blog-browser-coverage-and-timing
          path: apps/jp/artifacts/browser/
          if-no-files-found: error
          retention-days: 14
  shop:
    name: shop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/install-browsers.mjs shop
      - run: node scripts/ci-check.mjs shop
  public-source:
    name: public-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - run: node scripts/check-public-source.mjs
      - run: node --test scripts/*.test.mjs
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks git --redact --log-opts=--all
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun audit --audit-level=high
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Require clean analysis
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: node scripts/check-sarif.mjs
