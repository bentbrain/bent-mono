name: Quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-qualification:
    name: Release qualification
    if: always()
    needs: [checks, browser, shop, public-source, secrets, dependencies, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Quality job
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.QUALITY_RESULTS);
            const expected = ["checks", "browser", "shop", "public-source", "secrets", "dependencies", "codeql"];
            if (Object.keys(jobs).sort().join() !== expected.sort().join() ||
                Object.values(jobs).some(job => job.result !== "success")) {
              throw new Error("Every Quality job must succeed before production release");
            }
          '
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, knip, build, "test:integration"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: payload_migration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PAYLOAD_MIGRATION_TEST_DATABASE_URI: postgresql://test:test@127.0.0.1:5432/payload_migration_test
      PAYLOAD_STORAGE_SOURCE: r2
      R2_BUCKET: fixture-bucket
      R2_ENDPOINT: https://storage.example.invalid
      R2_PUBLIC_URL: https://media.example.invalid
      R2_ACCESS_KEY_ID: fixture-access
      R2_SECRET_ACCESS_KEY: fixture-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/ci-check.mjs '${{ matrix.check }}'
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: scope
        run: node scripts/ci-scope.mjs
      - run: node scripts/install-browsers.mjs browser
      - run: node scripts/ci-check.mjs browser
        env:
          E2E_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'critical' }}
      - name: Upload synthetic Trackmap browser results
        if: always() && steps.scope.outputs.trackmap == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trackmap-browser-results
          path: apps/trackmap/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload synthetic browser coverage
        if: always() && steps.scope.outputs.jp == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blog-browser-coverage-and-timing
          path: apps/jp/artifacts/browser/
          if-no-files-found: error
          retention-days: 14
  shop:
    name: shop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: scope
        run: node scripts/ci-scope.mjs
      - name: Install pinned Terraform for backend schema regression
        if: steps.scope.outputs.full == 'true'
        run: |
          archive="$RUNNER_TEMP/terraform_1.12.2_linux_amd64.zip"
          curl --fail --silent --show-error --location --output "$archive" https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          printf '%s  %s\n' '1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437' "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/shop-trust-terraform"
          unzip -q "$archive" -d "$RUNNER_TEMP/shop-trust-terraform"
      - run: node scripts/install-browsers.mjs shop
      - run: node scripts/ci-check.mjs shop
        env:
          SHOP_TRUST_SCHEMA_TERRAFORM: ${{ runner.temp }}/shop-trust-terraform/terraform
  public-source:
    name: public-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - run: node scripts/check-public-source.mjs
      - run: node --test scripts/*.test.mjs
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gitleaks v8.30.1, Linux x64 release asset.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-max-time 60 --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer ${GH_TOKEN:?GitHub token is required}" \
            --header 'Accept: application/octet-stream' --output /tmp/gitleaks.tar.gz \
            https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks git --redact --log-opts=--all
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun audit --audit-level=high
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The raw-flow gate requires both complete suites on PRs and main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_OVERLAY_ANALYSIS: 'false'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Download verified CodeQL bundle
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CodeQL v2.27.4, JavaScript Linux x64 release asset.
          archive="$RUNNER_TEMP/codeql-bundle-javascript-linux64.tar.zst"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-max-time 180 --connect-timeout 10 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN:?GitHub token is required}" \
            --header 'Accept: application/octet-stream' --output "$archive" \
            https://api.github.com/repos/github/codeql-action/releases/assets/692239234
          printf '%s  %s\n' '082e798c97831283a2a5f69e9198c51270e5767013d5333daeeab6520af9ce72' "$archive" | sha256sum --check
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          tools: ${{ runner.temp }}/codeql-bundle-javascript-linux64.tar.zst
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Require clean analysis
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: node scripts/check-sarif.mjs
      - name: Retain original CodeQL report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-original-sarif
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
