name: Qualify compatible backup renderer
run-name: Backup renderer · ${{ inputs.environment }} · ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Bootstrap compatible backup before publishing any composed products
        type: choice
        options: [development, production]
        required: true
      operation:
        description: Deploy a new backup or qualify an inspected completed deployment
        type: choice
        options: [deploy, recover]
        default: deploy
      recovery_source:
        description: Original deployment commit, only for verification of a completed deployment
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: products/shop

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository_id == vars.SHOP_REPOSITORY_ID && github.actor_id == vars.SHOP_OWNER_ID
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
    env:
      BACKUP_ENVIRONMENT: ${{ inputs.environment }}
      BACKUP_OPERATION: ${{ inputs.operation }}
      BACKUP_RECOVERY_SOURCE: ${{ inputs.recovery_source }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Verify bootstrap boundaries
        run: node --import ./scripts/test-protected-config.mjs --test scripts/backup-renderer-policy.test.mjs scripts/backup-renderer-context.test.mjs scripts/backup-renderer-rollout.test.mjs scripts/editorial-worker-probe.test.mjs scripts/editorial-source.test.mjs
      - name: Prepare, deploy and qualify the inactive backup
        run: node --import ./scripts/public-release-logging.mjs scripts/backup-renderer-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backup-renderer-${{ github.run_id }}
          path: backup-renderer-output/
          if-no-files-found: ignore
          retention-days: 14
