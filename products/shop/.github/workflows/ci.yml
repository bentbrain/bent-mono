name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  # A synchronize event queued while the PR was still a draft must not cancel
  # the required run started by the later ready_for_review event.
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/shop

jobs:
  repository:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout protected policy
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Prepare validation runtime
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        id: runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Record protected runtime
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        run: |
          if test -f scripts/pr-validation-runtime.mjs; then
            node scripts/pr-validation-runtime.mjs
          fi
      - name: Preserve protected runtime
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-validation-runtime-${{ github.run_id }}-${{ github.run_attempt }}-repository
          path: ${{ runner.temp }}/pr-validation-runtime-repository.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Checkout tested merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check repository with caches
        if: "!contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')"
        uses: ./products/shop/.github/actions/check
        with:
          suite: repository
      - name: Check repository without restored caches
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        uses: ./products/shop/.github/actions/check
        with:
          suite: repository
          node-version: ${{ steps.runtime.outputs.node-version }}
          fresh: 'true'

  browser:
    name: browser (${{ matrix.shard }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --ipc=host --init
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
        - /usr/bin/zip:/usr/local/bin/zip:ro
        - /usr/bin/unzip:/usr/local/bin/unzip:ro
    defaults:
      run:
        shell: bash
        working-directory: products/shop
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    env:
      PR_VALIDATION_SHARD: ${{ matrix.shard }}
    steps:
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: .
      - name: Checkout protected policy
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Prepare validation runtime
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        id: runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Record protected runtime
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        run: |
          if test -f scripts/pr-validation-runtime.mjs; then
            node scripts/pr-validation-runtime.mjs
          fi
      - name: Preserve protected runtime
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-validation-runtime-${{ github.run_id }}-${{ github.run_attempt }}-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/pr-validation-runtime-browser-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Checkout tested merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check browser with caches
        if: "!contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')"
        uses: ./products/shop/.github/actions/check
        with:
          suite: browser
          browser-shard: ${{ matrix.shard }}
      - name: Check browser without restored caches
        if: contains(github.event.pull_request.labels.*.name, 'ci:release-candidate')
        uses: ./products/shop/.github/actions/check
        with:
          suite: browser
          browser-shard: ${{ matrix.shard }}
          node-version: ${{ steps.runtime.outputs.node-version }}
          fresh: 'true'

  check:
    if: always() && github.event.pull_request.draft == false
    needs: [repository, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Aggregate validation
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$BROWSER_RESULT" = success
