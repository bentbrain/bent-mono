name: Schedule full Development qualification
on:
  schedule:
    # Monday 03:00 in Brisbane. This dispatches qualification, never a release.
    - cron: '0 17 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: schedule-native-qualification
  cancel-in-progress: false
jobs:
  schedule:
    if: github.repository_id == '{{SHOP:githubRepositoryId}}' && github.repository_owner_id == '{{SHOP:githubOwnerId}}' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check existing pair and release activity
        id: plan
        run: node scripts/scheduled-qualification.mjs
      - name: Preserve dispatch intent before contacting the workflow
        id: intent
        if: steps.plan.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-qualification-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/scheduled-qualification-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch exactly once from the preserved intent
        if: steps.plan.outputs.dispatch == 'true'
        env:
          INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
        run: node scripts/scheduled-qualification.mjs --dispatch
