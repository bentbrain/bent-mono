name: Schedule full Development qualification
on:
  schedule:
    # Monday 03:00 in Brisbane. This dispatches qualification, never a release.
    - cron: '0 17 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  checks: read
  statuses: read
  pull-requests: read
concurrency:
  group: schedule-native-qualification
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: products/shop

jobs:
  schedule:
    environment: Preview
    if: github.repository_id == vars.SHOP_REPOSITORY_ID && github.repository_owner_id == vars.SHOP_OWNER_ID && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        if: github.event_name == 'workflow_dispatch'
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Check existing pair and release activity
        id: plan
        run: node --import ./scripts/public-release-logging.mjs scripts/scheduled-qualification.mjs
      - name: Preserve dispatch intent before contacting the workflow
        id: intent
        if: steps.plan.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-qualification-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/scheduled-qualification-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch exactly once from the preserved intent
        if: steps.plan.outputs.dispatch == 'true'
        env:
          INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
        run: node --import ./scripts/public-release-logging.mjs scripts/scheduled-qualification.mjs --dispatch
      - name: Preserve encrypted operational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
