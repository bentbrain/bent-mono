name: Release and monitor native Production video
run-name: Native production · ${{ inputs.operation }} · ${{ inputs.release_mode || 'full' }} · ${{ inputs.verify_release || '-' }} · ${{ inputs.rollback_release || '-' }} · ${{ github.ref_name }} · ${{ github.sha }} · [${{ inputs.coordination_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Optional exact main commit for coordinated releases
        type: string
      coordination_id:
        description: Optional journal correlation ID
        type: string
      operation:
        description: Promote or inspect a verified pair, recover it, or run a bounded product repair
        type: choice
        required: true
        default: promote
        options: [promote, verify-candidate, inspect-image-plan, prepare-runtime, prepare-worker, prepare-monitor, monitor, release, rollback, canary, release-storefront, inspect-release, recover-release, recover-rehearsal, recover-canary, repair-featured-videos, sweep-products]
      promotion_input:
        description: Optional reviewed source-bound qualification, candidate and owner or automated acceptance JSON
        type: string
        required: false
      rollback_release:
        description: For rollback only, the original native-RUN_ID
        type: string
        required: false
      release_mode:
        description: API mode reuses the recorded live image; full qualification remains required
        type: choice
        default: full
        options: [full, api]
      verify_release:
        description: Recorded native-RUN_ID for canary, storefront, inspection or evidence-driven recovery
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '{{SHOP:githubRepositoryId}}' && github.repository_owner_id == '{{SHOP:githubOwnerId}}' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.operation == 'sweep-products' && 60 || 40 }}
    environment: Production
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
    env:
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check source and qualification before cloud preparation
        env:
          OPERATION: ${{ inputs.operation }}
          NATIVE_RELEASE_MODE: ${{ inputs.release_mode || 'full' }}
          NATIVE_VERIFY_RELEASE: ${{ inputs.verify_release }}
          NATIVE_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          NATIVE_PROMOTION_INPUT: ${{ inputs.promotion_input }}
        run: node scripts/release-preflight.mjs --environment production --lane native --operation "$OPERATION"
      - name: Check Production context and evidence guards
        run: node --test --test-concurrency=1 scripts/native-production-ci.test.mjs scripts/native-production-candidate.test.mjs scripts/native-production-runtime.test.mjs scripts/native-production-image.test.mjs scripts/native-production-foundation.test.mjs scripts/native-ci-candidate.test.mjs scripts/native-production-worker.test.mjs scripts/native-production-monitor.test.mjs scripts/native-production-release.test.mjs scripts/native-production-canary.test.mjs scripts/native-production-web-release.test.mjs scripts/native-release-timing.test.mjs
      - run: node --test --test-concurrency=1 scripts/native-production-release-inspection.test.mjs scripts/native-production-preflight-recovery.test.mjs scripts/native-production-creation-recovery.test.mjs scripts/native-production-rehearsal-recovery.test.mjs scripts/native-production-canary-recovery.test.mjs scripts/native-production-featured-video-recovery.test.mjs scripts/native-production-product-sweep.test.mjs
      - uses: oven-sh/setup-bun@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.operation == 'prepare-worker' || inputs.operation == 'release' || inputs.operation == 'promote' || inputs.operation == 'release-storefront' || inputs.operation == 'repair-featured-videos' || inputs.operation == 'sweep-products'
      - name: Install the Featured Design repair encoder
        if: inputs.operation == 'repair-featured-videos'
        run: sudo apt-get update --quiet && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
        if: inputs.operation == 'prepare-worker' || inputs.operation == 'release' || inputs.operation == 'promote' || inputs.operation == 'repair-featured-videos' || inputs.operation == 'sweep-products'
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        if: inputs.operation != 'repair-featured-videos' && inputs.operation != 'sweep-products'
        with:
          role-to-assume: arn:aws:iam::{{SHOP:awsAccountId}}:role/forever-tee-video-production-ci
          aws-region: ap-southeast-2
          allowed-account-ids: '{{SHOP:awsAccountId}}'
          role-session-name: native-production-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          retry-max-attempts: 3
      - name: Verify evidence and perform only the selected runtime operation
        env:
          NATIVE_OPERATION: ${{ inputs.operation }}
          NATIVE_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          NATIVE_PROMOTION_INPUT: ${{ inputs.promotion_input }}
          NATIVE_RELEASE_MODE: ${{ inputs.release_mode || 'full' }}
          NATIVE_VERIFY_RELEASE: ${{ inputs.verify_release }}
          NATIVE_ALERT_EMAIL: ${{ secrets.NATIVE_ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          STORY_VIDEO_LAMBDA_ACCESS_KEY_ID: ${{ secrets.STORY_VIDEO_LAMBDA_ACCESS_KEY_ID }}
          STORY_VIDEO_LAMBDA_SECRET_ACCESS_KEY: ${{ secrets.STORY_VIDEO_LAMBDA_SECRET_ACCESS_KEY }}
          STORY_VIDEO_GRANT_SECRET: ${{ secrets.STORY_VIDEO_GRANT_SECRET }}
          PRINTIFY_ASSET_DELIVERY_SECRET: ${{ secrets.PRINTIFY_ASSET_DELIVERY_SECRET }}
          PRINTIFY_WEBHOOK_SECRET: ${{ secrets.PRINTIFY_WEBHOOK_SECRET }}
          CART_LINE_CAPABILITY_SECRET: ${{ secrets.CART_LINE_CAPABILITY_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
          FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
          VERCEL_TOKEN: ${{ inputs.operation == 'release-storefront' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_PROJECT_ID: ${{ inputs.operation == 'release-storefront' && secrets.VERCEL_PROJECT_ID || '' }}
          VERCEL_ORG_ID: ${{ inputs.operation == 'release-storefront' && secrets.VERCEL_ORG_ID || '' }}
        run: node scripts/native-production-provision.mjs
      - name: Preserve release stage timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-timings-${{ github.run_id }}
          path: ${{ runner.temp }}/release-timings.ndjson
          if-no-files-found: ignore
          retention-days: 90
