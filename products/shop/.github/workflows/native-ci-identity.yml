name: Verify native CI identity

on:
  workflow_dispatch:
    inputs:
      proof_only:
        description: Verify signed Preview claims only, without AWS or storage qualification
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: products/shop

jobs:
  proof:
    if: github.repository_id == vars.SHOP_REPOSITORY_ID && github.repository_owner_id == vars.SHOP_OWNER_ID && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Preview
    permissions:
      pull-requests: read
      statuses: read
      checks: read
      actions: read
      contents: read
      id-token: write
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Check identity verifier
        run: node --import ./scripts/test-protected-config.mjs --test --test-concurrency=1 scripts/native-ci-identity.test.mjs scripts/native-ci-aws.test.mjs scripts/native-ci-lock-check.test.mjs
        env:
          SHOP_PROTECTED_CONFIG_JSON: ""
          SHOP_EVIDENCE_ENCRYPTION_KEY: ""
          SHOP_EVIDENCE_KEY_VERSION: "v1"
          SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ""
      - name: Verify signed Preview identity without AWS access
        run: node scripts/native-ci-identity.mjs

  identity:
    needs: proof
    if: needs.proof.result == 'success' && inputs.proof_only == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Preview
    permissions:
      pull-requests: read
      statuses: read
      checks: read
      actions: read
      contents: read
      id-token: write
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require authoritative exact-main monorepo quality
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Assume the personal Development inspection role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.SHOP_AWS_DEVELOPMENT_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ secrets.SHOP_AWS_ACCOUNT_ID }}
          role-session-name: native-${{ github.run_id }}
          role-duration-seconds: 900
          unset-current-credentials: true
          retry-max-attempts: 3
      - name: Verify CI account and state storage without writes
        run: node --import ./scripts/public-release-logging.mjs scripts/native-ci-aws.mjs
      - name: Check KMS write enforcement and conditional lock contention
        run: node --import ./scripts/public-release-logging.mjs scripts/native-ci-lock-check.mjs
      - name: Preserve encrypted operational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
