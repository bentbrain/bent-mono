name: Verify native CI identity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository_id == '{{SHOP:githubRepositoryId}}' && github.repository_owner_id == '{{SHOP:githubOwnerId}}'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check identity verifier
        run: node --test --test-concurrency=1 scripts/native-ci-identity.test.mjs scripts/native-ci-aws.test.mjs scripts/native-ci-lock-check.test.mjs
      - name: Verify signed Preview identity without AWS access
        run: node scripts/native-ci-identity.mjs
      - name: Assume the personal Development inspection role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::{{SHOP:awsAccountId}}:role/forever-tee-video-development-ci
          aws-region: ap-southeast-2
          allowed-account-ids: '{{SHOP:awsAccountId}}'
          role-session-name: native-${{ github.run_id }}
          role-duration-seconds: 900
          unset-current-credentials: true
          retry-max-attempts: 3
      - name: Verify CI account and state storage without writes
        run: node scripts/native-ci-aws.mjs
      - name: Check KMS write enforcement and conditional lock contention
        run: node scripts/native-ci-lock-check.mjs
