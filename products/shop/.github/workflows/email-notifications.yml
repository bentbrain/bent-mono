name: Email notifications

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ['shopify/notifications/**', '.github/workflows/email-notifications.yml']
  push:
    branches: [main]
    paths: ['shopify/notifications/**', '.github/workflows/email-notifications.yml']

permissions:
  contents: read

concurrency:
  group: email-notifications-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: products/shop

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: shopify/notifications
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shopify/notifications/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-notifications-${{ github.sha }}
          path: shopify/notifications/dist/
          if-no-files-found: error
          retention-days: 30
