name: Email notifications
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - products/shop/shopify/notifications/**
      - products/shop/.github/workflows/email-notifications.yml
      - .github/workflows/email-notifications.yml
      - package.json
      - bun.lock
  push:
    branches:
      - main
    paths:
      - products/shop/shopify/notifications/**
      - products/shop/.github/workflows/email-notifications.yml
      - .github/workflows/email-notifications.yml
      - package.json
      - bun.lock
permissions:
  contents: read
concurrency:
  group: email-notifications-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: products/shop
jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: products/shop/shopify/notifications
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-notifications-${{ github.sha }}
          path: products/shop/shopify/notifications/dist/
          if-no-files-found: error
          retention-days: 30
