name: Provision native Production foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Foundation only. No Worker, image deployment or provider cutover.
        type: choice
        required: true
        default: plan
        options: [plan, provision, enable-alerts, verify-alerts, recover-alerts, finish-alert-recovery]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  foundation:
    if: github.repository_id == '{{SHOP:githubRepositoryId}}' && github.repository_owner_id == '{{SHOP:githubOwnerId}}' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test the Production foundation guards
        run: node --test --test-concurrency=1 scripts/aws-personal-production-bootstrap.test.mjs scripts/native-production-foundation.test.mjs scripts/native-production-alert-recovery.test.mjs scripts/native-production-evidence.test.mjs
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::{{SHOP:awsAccountId}}:role/forever-tee-video-production-ci
          aws-region: ap-southeast-2
          allowed-account-ids: '{{SHOP:awsAccountId}}'
          role-session-name: native-production-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          retry-max-attempts: 3
      - name: Execute the selected creation-only foundation stage
        env:
          NATIVE_OPERATION: ${{ inputs.operation }}
          NATIVE_ALERT_EMAIL: ${{ secrets.NATIVE_ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/native-production-foundation.mjs
