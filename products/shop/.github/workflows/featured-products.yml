name: Featured designs
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [development, production]
        required: true
      operation:
        description: Inspect current slots or replace the complete selection
        type: choice
        options: [inspect, replace]
        required: true
      expected_revision:
        description: Revision from inspection, required for replace
        type: string
      command_id:
        description: Recovery only, exact UUID from the saved request
        type: string
      slot_1:
        description: Die face 1 configured product UUID, leave empty to omit
        type: string
      slot_2:
        description: Die face 2 configured product UUID, leave empty to omit
        type: string
      slot_3:
        description: Die face 3 configured product UUID, leave empty to omit
        type: string
      slot_4:
        description: Die face 4 configured product UUID, leave empty to omit
        type: string
      slot_5:
        description: Die face 5 configured product UUID, leave empty to omit
        type: string
      slot_6:
        description: Die face 6 configured product UUID, leave empty to omit
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: featured-products-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
    env:
      OPERATIONS_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      COMMAND_ID: ${{ inputs.command_id }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
      SLOT_1: ${{ inputs.slot_1 }}
      SLOT_2: ${{ inputs.slot_2 }}
      SLOT_3: ${{ inputs.slot_3 }}
      SLOT_4: ${{ inputs.slot_4 }}
      SLOT_5: ${{ inputs.slot_5 }}
      SLOT_6: ${{ inputs.slot_6 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Inspect or replace featured designs
        run: node workers/api/scripts/featured-products.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: featured-products-${{ github.run_id }}
          path: featured-products-*.json
          if-no-files-found: ignore
