name: Inspect Printify product contract
on:
  workflow_dispatch:
    inputs:
      product_id:
        description: Existing Printify product ID confirmed from the merchant product list
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository_id == '{{SHOP:githubRepositoryId}}' && github.repository_owner_id == '{{SHOP:githubOwnerId}}' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test scripts/inspect-printify-product.test.mjs
      - name: Read the existing product and report only field types
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          PRINTIFY_PRODUCT_ID: ${{ inputs.product_id }}
        run: node scripts/inspect-printify-product.mjs
