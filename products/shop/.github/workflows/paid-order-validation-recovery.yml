name: Recover a paid-order validation exception
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment
        type: choice
        options: [development, production]
        required: true
      operation:
        description: Plan or resolve only the reviewed line-identity exception
        type: choice
        options: [plan, apply]
        required: true
      paid_order_id:
        description: Exact internal paid order UUID
        type: string
        required: true
      expected_plan_sha256:
        description: Unchanged reviewed plan hash, required for apply
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: paid-order-validation-recovery-${{ inputs.environment }}-${{ inputs.paid_order_id }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: products/shop

jobs:
  recover:
    if: github.repository_id == vars.SHOP_REPOSITORY_ID && github.repository_owner_id == vars.SHOP_OWNER_ID && github.actor_id == vars.SHOP_OWNER_ID && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify recovery boundaries
        run: node --import ./scripts/test-protected-config.mjs --test scripts/paid-order-validation-recovery.test.mjs
      - name: Recheck and perform only the selected order operation
        env:
          OPERATIONS_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          PAID_ORDER_ID: ${{ inputs.paid_order_id }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
        run: node --import ./scripts/public-release-logging.mjs scripts/paid-order-validation-recovery.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: order-validation-recovery-${{ github.run_id }}
          path: order-validation-recovery-*.json
          if-no-files-found: ignore
