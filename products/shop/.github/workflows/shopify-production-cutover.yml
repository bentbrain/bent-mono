name: Cut over Shopify Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: products/shop

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    env:
      BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
      SHOPIFY_ADMIN_STORE_DOMAIN: ${{ secrets.SHOPIFY_ADMIN_STORE_DOMAIN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      WORKER_URL: ${{ vars.WORKER_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Validate cutover configuration
        run: |
          required=(
            BENT_SHIRT_OPERATIONS_SECRET
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            FOREVER_TEE_API_SHARED_SECRET
            SHOPIFY_ADMIN_STORE_DOMAIN
            SHOPIFY_CLIENT_ID
            SHOPIFY_CLIENT_SECRET
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            VERCEL_TOKEN
            WORKER_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing Production configuration: $name" >&2
              exit 1
            fi
          done
          case "$WORKER_URL" in
            https://*) ;;
            *)
              echo "WORKER_URL must be an HTTPS URL." >&2
              exit 1
              ;;
          esac
          case "$SHOPIFY_ADMIN_STORE_DOMAIN" in
            *.myshopify.com) ;;
            *)
              echo "SHOPIFY_ADMIN_STORE_DOMAIN must be a myshopify.com hostname." >&2
              exit 1
              ;;
          esac
      - name: Install Bun
        uses: oven-sh/setup-bun@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          bun-version: 1.4.4
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Hold sales during cutover
        run: >-
          bun run --filter @forever-tee/api exec node scripts/run-operations.mjs
          pause-sales "Launch qualification is incomplete."
      - name: Configure Shopify Worker secrets
        run: |
          jq -n \
            --arg shopifyDomain "$SHOPIFY_ADMIN_STORE_DOMAIN" \
            --arg shopifyClientId "$SHOPIFY_CLIENT_ID" \
            --arg shopifyClientSecret "$SHOPIFY_CLIENT_SECRET" \
            '{
              SHOPIFY_ADMIN_STORE_DOMAIN: $shopifyDomain,
              SHOPIFY_CLIENT_ID: $shopifyClientId,
              SHOPIFY_CLIENT_SECRET: $shopifyClientSecret
            }' |
            cd workers/api && bunx --no-install wrangler secret bulk --env production
      - name: Refresh Printify catalogue
        run: >-
          bun run --filter @forever-tee/api exec node scripts/run-operations.mjs
          refresh-catalogue
      - name: Refresh Shopify variant mapping
        run: >-
          bun run --filter @forever-tee/api exec node scripts/run-operations.mjs
          refresh-variant-mapping
      - name: Confirm sales remain paused
        run: >-
          bun run --filter @forever-tee/api exec node scripts/run-operations.mjs
          read-sales-status
      - name: Verify Worker release
        env:
          FOREVER_TEE_API_URL: ${{ vars.WORKER_URL }}
          FOREVER_TEE_ENFORCE_WORKER_RELEASE: "1"
        run: bun run --filter @forever-tee/web verify:worker-release
      - name: Pull Vercel Production environment
        run: bunx vercel@59.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Deploy storefront
        run: |
          deployment_url="$(
            bunx vercel@59.5.0 deploy \
              --build-env "VERCEL_GIT_COMMIT_SHA=$GITHUB_SHA" \
              --prod \
              --token="$VERCEL_TOKEN"
          )"
          echo "### Shopify Production cutover" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Sales remain paused pending launch qualification." >> "$GITHUB_STEP_SUMMARY"
