name: Product lifecycle
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [development, production]
        required: true
      operation:
        description: Inspect current state or apply a reviewed transition
        type: choice
        options: [inspect, transition]
        required: true
      configured_product_id:
        description: Exact configured product UUID
        type: string
        required: true
      expected_state:
        description: Current state from inspection
        type: choice
        options: [active, suspended, unpublished]
      target_state:
        description: Desired state (ignored for inspect)
        type: choice
        options: [suspended, active, unpublished, retired]
      reason:
        description: Review reason, 5–200 characters; no customer data
        type: string
      confirmation:
        description: Owner only; type UNPUBLISH followed by the product UUID, or RETIRE followed by the UUID
        type: string
      command_id:
        description: For recovery only, reuse the exact UUID from the saved request receipt
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: product-lifecycle-${{ inputs.environment }}-${{ inputs.configured_product_id }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: products/shop

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
    env:
      OPERATIONS_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      CONFIGURED_PRODUCT_ID: ${{ inputs.configured_product_id }}
      EXPECTED_STATE: ${{ inputs.expected_state }}
      TARGET_STATE: ${{ inputs.target_state }}
      REASON: ${{ inputs.reason }}
      CONFIRMATION: ${{ inputs.confirmation }}
      COMMAND_ID: ${{ inputs.command_id }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require main and operations authentication
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$BENT_SHIRT_OPERATIONS_SECRET"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Inspect or transition product
        run: node workers/api/scripts/product-lifecycle.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-lifecycle-${{ github.run_id }}
          path: product-lifecycle-*.json
          if-no-files-found: ignore
