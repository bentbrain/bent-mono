name: Operate bent.shop
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and Worker target
        required: true
        type: choice
        options:
          - development
          - production
      action:
        description: Operation to run
        required: true
        type: choice
        options:
          - read-sales-status
          - pause-sales
          - refresh-catalogue
          - refresh-print-assets
          - refresh-variant-mapping
          - resume-sales
      expected_source:
        description: Exact reviewed current main commit
        type: string
        required: true
      private_input:
        description: Authenticated ciphertext from release:seal-input for this workflow, environment, operation and source
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: operations-${{ inputs.environment }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: products/shop
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
    env:
      SHOP_PROTECTED_CONFIG_JSON: ${{ secrets.SHOP_PROTECTED_CONFIG_JSON }}
      SHOP_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.SHOP_EVIDENCE_ENCRYPTION_KEY }}
      SHOP_EVIDENCE_KEY_VERSION: ${{ vars.SHOP_EVIDENCE_KEY_VERSION }}
      SHOP_EVIDENCE_PREVIOUS_KEYS_JSON: ${{ secrets.SHOP_EVIDENCE_PREVIOUS_KEYS_JSON }}
      SHOP_OPERATION_ENVIRONMENT: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
      ACTION: ${{ inputs.action }}
      BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
      FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
      WORKER_URL: ${{ vars.WORKER_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Mask protected configuration leaves
        run: node scripts/mask-release-config.mjs
      - name: Validate authenticated operational dispatch
        run: node scripts/operational-dispatch-guard.mjs
      - name: Require authoritative exact-main monorepo quality
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../../scripts/require-release-checks.mjs --sha "$GITHUB_SHA"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install operations dependencies
        run: bun install --frozen-lockfile --filter @forever-tee/api...
        working-directory: .
      - name: Run operation
        run: |
          node scripts/protected-command.mjs -- bash -euo pipefail <<'SHOP_PROTECTED_SHELL'
          node --import ./scripts/public-release-logging.mjs --import ./scripts/decode-operational-dispatch.mjs workers/api/scripts/run-operations.mjs
          SHOP_PROTECTED_SHELL
      - name: Seal private operational receipts and media
        if: always()
        run: node --import ./scripts/public-release-logging.mjs scripts/seal-operational-artifacts.mjs
      - name: Preserve encrypted operational artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operations-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-operational-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve encrypted operational diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shop-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/shop-encrypted-diagnostics/${{ github.job }}/${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
    if: github.repository_id == vars.SHOP_REPOSITORY_ID && github.repository_owner_id == vars.SHOP_OWNER_ID && github.ref == 'refs/heads/main' && github.run_attempt == 1
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
run-name: Operate bent.shop · ${{ inputs.environment || 'production' }} · ${{ github.sha }}
