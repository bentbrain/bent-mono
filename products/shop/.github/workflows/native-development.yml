name: Build native Development candidate
run-name: Native development · ${{ inputs.operation }} · ${{ inputs.release_mode || 'full' }} · ${{ inputs.verify_release || '-' }} · ${{ inputs.rollback_release || '-' }} · ${{ github.ref_name }} · ${{ github.sha }} · [${{ inputs.coordination_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Optional exact main commit for coordinated releases
        type: string
      coordination_id:
        description: Optional journal correlation ID
        type: string
      operation:
        description: Plan/deploy a pair, independently qualify the live pair, or recover it
        type: choice
        default: plan
        options: [plan, build-candidate, release, rollback, recover-rollback, qualify, qualify-exhaustion, qualify-faults, qualify-termination, qualify-load, qualify-all, verify-qualification, repair-schedule, cleanup-qualification, cleanup-failed-qualification, qualify-components]
      release_mode:
        description: API mode reuses the live image; relevant qualification is required separately before Production
        type: choice
        default: full
        options: [full, api]
      verify_release:
        description: For qualification or schedule repair, the live native-RUN_ID
        type: string
        required: false
      qualification_reference:
        description: For cleanup recovery, exact immutable functional-summary JSON; failed cleanup uses original cleanup-inventory JSON
        type: string
        required: false
      scheduled_qualification:
        description: Weekly full check; preserve the existing owner-reviewed renderer baseline
        type: boolean
        default: false
      renderer_reference:
        description: For component qualification, the immutable full renderer receipt reference JSON
        type: string
        required: false
      rollback_release:
        description: Original release for rollback; failed rollback run for recover-rollback
        type: string
        required: false

      rollback_reference:
        description: For recover-rollback only, exact immutable original rollback.json reference
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  check:
    if: github.repository_id == '{{SHOP:githubRepositoryId}}' && github.repository_owner_id == '{{SHOP:githubOwnerId}}'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check native request before dependency installation
        env:
          OPERATION: ${{ inputs.operation }}
          NATIVE_RELEASE_MODE: ${{ inputs.release_mode || 'full' }}
          NATIVE_VERIFY_RELEASE: ${{ inputs.verify_release }}
          NATIVE_QUALIFICATION_REFERENCE: ${{ inputs.qualification_reference }}
          NATIVE_RENDERER_REFERENCE: ${{ inputs.renderer_reference }}
          NATIVE_SCHEDULED_QUALIFICATION: ${{ inputs.scheduled_qualification }}
          NATIVE_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          NATIVE_ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
        run: node scripts/release-preflight.mjs --environment development --lane native --operation "$OPERATION"
      - name: Reuse CI for the exact release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reuse-ci.mjs
      - name: Check commit without existing CI
        if: steps.ci.outputs.reused != 'true'
        uses: ./.github/actions/check
        env:
          TURBO_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.ref == 'refs/heads/main' && vars.TURBO_TEAM || '' }}
  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: Preview
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_COORDINATION_ID: ${{ inputs.coordination_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify coordinated source before any release work
        run: node scripts/release-dispatch-guard.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.operation == 'plan' || inputs.operation == 'release' || inputs.operation == 'rollback' || inputs.operation == 'recover-rollback' || inputs.operation == 'qualify-all' || inputs.operation == 'qualify-components' || inputs.operation == 'cleanup-failed-qualification'
      - run: bun install --frozen-lockfile
        if: inputs.operation == 'plan' || inputs.operation == 'release' || inputs.operation == 'rollback' || inputs.operation == 'recover-rollback' || inputs.operation == 'qualify-all' || inputs.operation == 'qualify-components' || inputs.operation == 'cleanup-failed-qualification'
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::{{SHOP:awsAccountId}}:role/forever-tee-video-development-ci
          aws-region: ap-southeast-2
          allowed-account-ids: '{{SHOP:awsAccountId}}'
          role-session-name: native-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          retry-max-attempts: 3
      - name: Verify candidate and execute only the selected guarded Development operation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          BENT_SHIRT_OPERATIONS_SECRET: ${{ secrets.BENT_SHIRT_OPERATIONS_SECRET }}
          FOREVER_TEE_API_SHARED_SECRET: ${{ secrets.FOREVER_TEE_API_SHARED_SECRET }}
          PRODUCT_IMAGE_RENDERER_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRINTIFY_ASSET_DELIVERY_SECRET: ${{ secrets.PRINTIFY_ASSET_DELIVERY_SECRET }}
          PRINTIFY_WEBHOOK_SECRET: ${{ secrets.PRINTIFY_WEBHOOK_SECRET }}
          CART_LINE_CAPABILITY_SECRET: ${{ secrets.CART_LINE_CAPABILITY_SECRET }}
          NATIVE_OPERATION: ${{ inputs.operation || 'plan' }}
          NATIVE_ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          NATIVE_ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
          NATIVE_RELEASE_MODE: ${{ inputs.release_mode || 'full' }}
          NATIVE_VERIFY_RELEASE: ${{ inputs.verify_release }}
          NATIVE_QUALIFICATION_REFERENCE: ${{ inputs.qualification_reference }}
          NATIVE_RENDERER_REFERENCE: ${{ inputs.renderer_reference }}
          NATIVE_SCHEDULED_QUALIFICATION: ${{ inputs.scheduled_qualification }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/native-ci-development.mjs
      - name: Preserve immutable qualification reference pointers
        if: always() && (inputs.operation == 'qualify-all' || inputs.operation == 'cleanup-qualification' || inputs.operation == 'qualify-components')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-reference-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qualification*reference.json
            ${{ runner.temp }}/renderer-reference.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve release stage timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-timings-${{ github.run_id }}
          path: ${{ runner.temp }}/release-timings.ndjson
          if-no-files-found: ignore
          retention-days: 90
