name: Check repository
description: Run repository checks with dependency, task and Next.js caches
inputs:
  node-version:
    description: Exact Node version captured before PR code, or the default main runtime
    default: '24.18.0'
  fresh:
    description: Execute release-candidate checks without restored dependency, task or browser caches
    default: 'false'
  suite:
    description: Run all checks, repository checks, or fixture browser checks
    default: 'all'
  browser-shard:
    description: Optional fixture browser shard index out of two isolated jobs
    default: ''
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: Install Node.js
      if: inputs.fresh != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Install fresh validation Node.js
      if: inputs.fresh == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Restore task and Next.js caches
      if: inputs.fresh != 'true'
      id: checks-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .turbo/cache
          products/shop/apps/web/.next/cache
        # Turbo validates task inputs; Next validates its cache. PR writes remain
        # scoped by GitHub to refs/pull/N/merge and cannot seed main's cache.
        key: ${{ runner.os }}-${{ runner.arch }}-checks-v2-${{ hashFiles('bun.lock') }}-${{ inputs.suite }}-${{ inputs.browser-shard }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-checks-v2-${{ hashFiles('bun.lock') }}-${{ inputs.suite }}-${{ inputs.browser-shard }}-
          ${{ runner.os }}-${{ runner.arch }}-checks-v2-${{ hashFiles('bun.lock') }}-all--
          ${{ runner.os }}-${{ runner.arch }}-checks-v1-${{ hashFiles('bun.lock') }}-
    - run: bun install --frozen-lockfile
      shell: bash
      working-directory: .
    - name: Restore local browser
      if: inputs.fresh != 'true' && inputs.suite != 'repository'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: browser-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('bun.lock') }}
    - name: Install local browser and OS dependencies
      if: inputs.suite != 'repository'
      run: node ../../../../scripts/install-playwright.mjs . chromium
      shell: bash
      working-directory: products/shop/apps/web
    - name: Catch browser regressions before deployment
      if: inputs.suite != 'repository'
      run: bun run test:e2e:ci
      env:
        CI_FRESH_VALIDATION: ${{ inputs.fresh }}
        PLAYWRIGHT_SHARD: ${{ inputs.browser-shard != '' && format('{0}/2', inputs.browser-shard) || '' }}
      shell: bash
      working-directory: products/shop
    - name: Save early browser failure artifacts
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: local-browser-failures-${{ github.job }}-${{ inputs.browser-shard }}
        path: products/shop/apps/web/test-results
        if-no-files-found: ignore
        retention-days: 7
    - name: Save local browser
      if: github.ref == 'refs/heads/main' && inputs.suite != 'repository' && steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('bun.lock') }}
    - run: bun run check:ci
      if: inputs.suite != 'browser'
      env:
        CI_FRESH_VALIDATION: ${{ inputs.fresh }}
        SHOP_WORKFLOW_PROOF_ROOT: ${{ runner.temp }}/shop-workflow-proofs-${{ github.job }}
      shell: bash
      working-directory: products/shop
    - name: Seal structured source proof observations
      if: always() && inputs.suite != 'browser'
      run: node scripts/testing/workflow-proof-evidence.mjs
      shell: bash
      working-directory: products/shop
    - name: Preserve encrypted source proof observations
      if: always() && inputs.suite != 'browser'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: workflow-proof-${{ github.run_id }}-${{ github.job }}
        path: ${{ runner.temp }}/shop-workflow-evidence-${{ github.job }}/sealed
        if-no-files-found: error
        retention-days: 14
    - name: Bound regenerable task cache snapshots
      run: node scripts/actions-cache.mjs --trim
      shell: bash
      working-directory: products/shop
    - name: Save task and Next.js caches
      if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && steps.checks-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .turbo/cache
          products/shop/apps/web/.next/cache
        key: ${{ runner.os }}-${{ runner.arch }}-checks-v2-${{ hashFiles('bun.lock') }}-${{ inputs.suite }}-${{ inputs.browser-shard }}-${{ github.sha }}
    - name: Summarize task cache evidence
      if: always()
      id: cache-report
      run: |
        path="$RUNNER_TEMP/task-cache-$GITHUB_JOB.json"
        node scripts/cache-report.mjs "$path"
        echo "path=$path" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: products/shop
    - name: Preserve task cache evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: task-cache-${{ github.run_id }}-${{ github.job }}-${{ inputs.browser-shard }}
        path: ${{ steps.cache-report.outputs.path }}
        if-no-files-found: ignore
        retention-days: 14
    - name: Record validated component inputs
      if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.suite == 'all'
      id: validation-inputs
      run: |
        node scripts/validation-inputs.mjs
        echo "path=$RUNNER_TEMP/validation-inputs-$GITHUB_JOB.json" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: products/shop
    - name: Preserve validated component inputs
      if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.suite == 'all'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: validation-inputs-${{ github.run_id }}-${{ github.job }}
        path: ${{ steps.validation-inputs.outputs.path }}
        if-no-files-found: ignore
        retention-days: 30
